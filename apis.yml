aid: spencer-health-solutions
name: Spencer Health Solutions
description: >-
  Spencer Health Solutions is a Morrisville, North Carolina medical device and digital health
  company behind spencer®, an in-home smart medication dispenser that combines automated
  multi-dose dispensing from pharmacy-prepared refills with telehealth, patient surveys and
  connected Bluetooth biometric devices. The spencer platform pairs the countertop device with
  spencerAssist®, a mobile app for patients and caregivers, and spencerCare™, a web portal that
  lets healthcare professionals run real-time alerts, telehealth visits and longitudinal
  real-world data collection. The company sells into three markets — care management for home
  care and senior living, patient support programs for pharmaceutical manufacturers, and
  decentralized clinical trials, where the spencer SmartHub™ serves as the in-home trial partner
  — and reports a 97% medication adherence rate across more than 5,800 patients in the United
  States, Canada and Europe. Spencer Health Solutions publishes no public developer program,
  API reference or machine-readable contract; the platform is delivered as a managed device and
  portal offering through direct commercial and partner agreements, including a 2025 partnership
  with PharMerica.
